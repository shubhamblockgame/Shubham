<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shubham Block Game</title>

<style>
body{
 margin:0;
 background:#425a94;
 font-family:system-ui;
 color:#fff;
 text-align:center;
 user-select:none;
}

.top{
 display:flex;
 justify-content:space-between;
 padding:12px 20px;
 font-weight:900;
}

.board-wrap{display:flex;justify-content:center;margin-top:10px}

.board{
 width:330px;
 padding:14px;
 background:#0d1530;
 border-radius:26px;
 display:grid;
 grid-template-columns:repeat(10,1fr);
 gap:6px;
 box-shadow:
  0 0 0 3px #6fd8ff inset,
  0 0 30px #6fd8ff;
}

.cell{
 aspect-ratio:1;
 background:#1b2a55;
 border-radius:8px;
}

.filled{
 background:var(--c);
 box-shadow:
  inset 0 4px 8px rgba(255,255,255,.55),
  inset 0 -4px 8px rgba(0,0,0,.35);
}

.bottom{
 display:flex;
 justify-content:center;
 gap:50px;
 padding:35px 0;
}

.piece{
 display:grid;
 gap:4px;
 cursor:grab;
 touch-action:none;
}

.block{
 width:28px;height:28px;
 border-radius:7px;
 background:var(--c);
 box-shadow:
  inset 0 4px 8px rgba(255,255,255,.55),
  inset 0 -4px 8px rgba(0,0,0,.35);
}

.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 display:flex;
 align-items:center;
 justify-content:center;
}

.popup{
 background:#2f4575;
 padding:25px;
 border-radius:18px;
 width:260px;
}

.popup h2{margin:0 0 10px}

.popup button{
 width:100%;
 padding:12px;
 margin-top:10px;
 border:none;
 border-radius:12px;
 font-size:16px;
 font-weight:700;
 background:#5aa7ff;
 color:#fff;
}
</style>
</head>

<body>

<div class="top">
 <div>👑 <span id="score">0</span></div>
 <div>LEVEL <span id="level">1</span></div>
</div>

<div class="board-wrap">
 <div class="board" id="board"></div>
</div>

<div class="bottom" id="pieces"></div>

<div class="overlay" id="menu">
 <div class="popup">
  <h2>Select Difficulty</h2>
  <button onclick="start(0)">LOW</button>
  <button onclick="start(1)">MEDIUM</button>
  <button onclick="start(2)">HIGH</button>
 </div>
</div>

<div class="overlay" id="over" style="display:none">
 <div class="popup">
  <h2>Game Over</h2>
  <button onclick="menu()">Replay</button>
 </div>
</div>

<script>
const board=document.getElementById("board");
const piecesBox=document.getElementById("pieces");
const scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");
const menuBox=document.getElementById("menu");
const overBox=document.getElementById("over");

let grid=[],score=0,level=1,diff=0;

const shapes=[
 [[0,0],[1,0],[0,1]],                // L
 [[0,0],[1,0],[2,0]],                // line
 [[0,0],[1,0],[0,1],[1,1]],          // square
 [[0,0],[1,0],[2,0],[1,1]],          // T
 [[0,0],[1,0],[1,1],[2,1]],          // Z
 [[0,0],[1,0],[2,0],[1,-1],[1,1]]    // plus
];

const colors=["#7b6cff","#ff8b3d","#4fa3ff","#8cff5a","#d07bff"];

function beep(f,d){
 const a=new AudioContext();
 const o=a.createOscillator();
 const g=a.createGain();
 o.connect(g); g.connect(a.destination);
 o.frequency.value=f; o.start();
 g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
}

function vibr(t){navigator.vibrate&&navigator.vibrate(t)}

function menu(){
 menuBox.style.display="flex";
 overBox.style.display="none";
}

function start(d){
 diff=d;
 menuBox.style.display="none";
 overBox.style.display="none";
 board.innerHTML=""; piecesBox.innerHTML="";
 grid=Array(100).fill(0);
 score=0; level=1;
 scoreEl.textContent=0;
 levelEl.textContent=1;

 for(let i=0;i<100;i++){
  const c=document.createElement("div");
  c.className="cell";
  board.appendChild(c);
 }
 spawn();
}

function spawn(){
 piecesBox.innerHTML="";
 for(let i=0;i<3;i++){
  const shape=shapes[Math.random()*shapes.length|0];
  const color=colors[Math.random()*colors.length|0];
  const p=document.createElement("div");
  p.className="piece";
  p.style.setProperty("--c",color);
  p.style.gridTemplateColumns=`repeat(${Math.max(...shape.map(s=>s[0]))+1},auto)`;

  shape.forEach(()=> {
   const b=document.createElement("div");
   b.className="block";
   b.style.setProperty("--c",color);
   p.appendChild(b);
  });

  let drag=false,ox,oy;
  p.onpointerdown=e=>{
   drag=true; ox=e.clientX; oy=e.clientY;
   p.setPointerCapture(e.pointerId);
   p.style.position="fixed";
   p.style.zIndex=99;
  };

  p.onpointermove=e=>{
   if(!drag)return;
   p.style.left=e.clientX-ox+"px";
   p.style.top=e.clientY-oy+"px";
  };

  p.onpointerup=e=>{
   drag=false;
   const r=board.getBoundingClientRect();
   if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){
    const s=r.width/10;
    const x=Math.floor((e.clientX-r.left)/s);
    const y=Math.floor((e.clientY-r.top)/s);
    if(place(shape,x,y,color)){
     p.remove(); score+=shape.length*10;
     scoreEl.textContent=score;
     beep(700,.08); vibr(40);
     if(!piecesBox.children.length) spawn();
     clearLines(); return;
    }
   }
   p.style.position="";
   p.style.left=""; p.style.top="";
  };
  piecesBox.appendChild(p);
 }
 if(!canMove()) overBox.style.display="flex";
}

function place(shape,x,y,c){
 for(let s of shape){
  const nx=x+s[0], ny=y+s[1];
  if(nx<0||ny<0||nx>=10||ny>=10||grid[ny*10+nx]) return false;
 }
 shape.forEach(s=>{
  const i=(y+s[1])*10+(x+s[0]);
  grid[i]=1;
  board.children[i].classList.add("filled");
  board.children[i].style.setProperty("--c",c);
 });
 return true;
}

function clearLines(){
 for(let i=0;i<10;i++){
  let r=true,c=true;
  for(let j=0;j<10;j++){
   r&=grid[i*10+j];
   c&=grid[j*10+i];
  }
  if(r||c){
   for(let j=0;j<10;j++){
    grid[r?i*10+j:j*10+i]=0;
    board.children[r?i*10+j:j*10+i].className="cell";
   }
   score+=100; scoreEl.textContent=score;
   beep(300,.15); vibr(80);
  }
 }
 if(score>level*500){level++;levelEl.textContent=level}
}

function canMove(){
 return shapes.some(sh=>grid.some((_,i)=>{
  const x=i%10,y=i/10|0;
  return place(sh,x,y,"#000");
 }));
}

menu();
</script>
</body>
</html>
