<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Shubham Block</title>

<style>
body{
  margin:0;
  background:#3556a8;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  text-align:center;
  touch-action:none;
}

/* ===== HEADER ===== */
header{
  padding:10px 0 4px;
}
header h1{
  margin:0;
  font-size:18px;
  letter-spacing:1px;
}
#score{
  font-size:46px;
  font-weight:bold;
}

/* ===== CANVAS ===== */
canvas{
  display:block;
  margin:10px auto 5px;
  background:#1e2a4f;
  border-radius:14px;
}
#status{
  font-size:12px;
  opacity:.7;
  margin-bottom:8px;
}
</style>
</head>

<body>

<header>
  <h1>Shubham Block</h1>
  <div id="score">0</div>
</header>

<canvas id="game"></canvas>
<div id="status">drag • snap • blast</div>

<script>
/* =====================================================
   BASIC SETUP
===================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 10;
const CELL = Math.floor(Math.min(window.innerWidth,420)/SIZE);
canvas.width = CELL*SIZE;
canvas.height = CELL*SIZE + 140;

let score = 0;
let grid = Array(SIZE*SIZE).fill(null);

/* =====================================================
   COLORS & SHAPES
===================================================== */
const COLORS = ["#4da3ff","#facc15","#a855f7","#22c55e","#fb923c"];

const SHAPES = [
 [[1,1,1],[0,1,0]],     // T
 [[1,1],[1,1]],         // square
 [[1,1,1,1]],           // line
 [[1,0],[1,0],[1,1]],   // L
 [[0,1],[1,1],[1,0]]    // Z
];

/* =====================================================
   PIECES
===================================================== */
let pieces = [];
let dragging = null;
let offX = 0, offY = 0;
let ghost = null;

function newPieces(){
  pieces=[];
  for(let i=0;i<3;i++){
    pieces.push({
      shape:SHAPES[Math.floor(Math.random()*SHAPES.length)],
      color:COLORS[Math.floor(Math.random()*COLORS.length)],
      x: CELL*(i*3+2),
      y: CELL*SIZE + 30
    });
  }
}

/* =====================================================
   DRAW
===================================================== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* board */
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      const i=y*SIZE+x;
      ctx.fillStyle = grid[i] || "#111a33";
      ctx.fillRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);
    }
  }

  /* ghost preview */
  if(ghost){
    ctx.globalAlpha = 0.35;
    ghost.cells.forEach(i=>{
      let x=i%SIZE, y=Math.floor(i/SIZE);
      ctx.fillStyle = ghost.color;
      ctx.fillRect(x*CELL+4,y*CELL+4,CELL-8,CELL-8);
    });
    ctx.globalAlpha = 1;
  }

  /* pieces */
  pieces.forEach(p=>{
    p.shape.forEach((r,ry)=>{
      r.forEach((v,rx)=>{
        if(v){
          ctx.fillStyle=p.color;
          ctx.fillRect(
            p.x+rx*CELL+2,
            p.y+ry*CELL+2,
            CELL-4,CELL-4
          );
        }
      });
    });
  });
}

/* =====================================================
   LOGIC
===================================================== */
function canPlace(shape,gx,gy){
  let cells=[];
  for(let r=0;r<shape.length;r++){
    for(let c=0;c<shape[r].length;c++){
      if(shape[r][c]){
        let nx=gx+c, ny=gy+r;
        if(nx<0||ny<0||nx>=SIZE||ny>=SIZE) return null;
        let idx=ny*SIZE+nx;
        if(grid[idx]) return null;
        cells.push(idx);
      }
    }
  }
  return cells;
}

function placePiece(p,cells){
  cells.forEach(i=>grid[i]=p.color);
  score += cells.length*10;
  clearLines();
  updateScore();
}

function clearLines(){
  let cleared=false;

  for(let i=0;i<SIZE;i++){
    let row=true,col=true;
    for(let j=0;j<SIZE;j++){
      if(!grid[i*SIZE+j]) row=false;
      if(!grid[j*SIZE+i]) col=false;
    }
    if(row){
      for(let j=0;j<SIZE;j++) grid[i*SIZE+j]=null;
      score+=100; cleared=true;
    }
    if(col){
      for(let j=0;j<SIZE;j++) grid[j*SIZE+i]=null;
      score+=100; cleared=true;
    }
  }
  if(cleared) updateScore();
}

function updateScore(){
  document.getElementById("score").innerText=score;
}

/* =====================================================
   GAME OVER
===================================================== */
function hasMove(){
  for(let p of pieces){
    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){
        if(canPlace(p.shape,x,y)) return true;
      }
    }
  }
  return false;
}

/* =====================================================
   DRAG & DROP
===================================================== */
canvas.onpointerdown=e=>{
  const mx=e.offsetX,my=e.offsetY;
  pieces.forEach(p=>{
    p.shape.forEach((r,ry)=>{
      r.forEach((v,rx)=>{
        if(v){
          let x=p.x+rx*CELL, y=p.y+ry*CELL;
          if(mx>x&&mx<x+CELL&&my>y&&my<y+CELL){
            dragging=p;
            offX=mx-p.x;
            offY=my-p.y;
          }
        }
      });
    });
  });
};

canvas.onpointermove=e=>{
  if(!dragging) return;
  dragging.x=e.offsetX-offX;
  dragging.y=e.offsetY-offY;

  let gx=Math.round(dragging.x/CELL);
  let gy=Math.round(dragging.y/CELL);
  let cells=canPlace(dragging.shape,gx,gy);
  ghost = cells ? {cells,color:dragging.color}:null;
};

canvas.onpointerup=e=>{
  if(!dragging) return;
  let gx=Math.round(dragging.x/CELL);
  let gy=Math.round(dragging.y/CELL);
  let cells=canPlace(dragging.shape,gx,gy);

  if(cells){
    placePiece(dragging,cells);
    pieces = pieces.filter(p=>p!==dragging);
    if(pieces.length===0) newPieces();
    if(!hasMove()){
      setTimeout(()=>alert("Game Over!\nScore: "+score),100);
    }
  }
  dragging=null;
  ghost=null;
};

/* =====================================================
   LOOP
===================================================== */
newPieces();
function loop(){
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
