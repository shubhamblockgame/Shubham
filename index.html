<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shubham's Block Game</title>

<style>
body{margin:0;background:#3f5593;font-family:sans-serif;color:#fff;text-align:center}
.top{display:flex;justify-content:space-between;padding:14px;max-width:420px;margin:auto}
.board{
 width:320px;margin:14px auto;padding:12px;
 background:#1b2646;border-radius:18px;
 display:grid;grid-template-columns:repeat(10,1fr);gap:6px;
 box-shadow:0 0 0 2px #6fd3ff inset
}
.cell{aspect-ratio:1;background:#0f1830;border-radius:6px}
.filled{box-shadow:inset 0 2px 4px rgba(255,255,255,.35)}
.orange{background:linear-gradient(#ffb25f,#ff7a18)}
.blue{background:linear-gradient(#5fa7ff,#356bff)}
.green{background:linear-gradient(#6dff9a,#26b864)}
.purple{background:linear-gradient(#c28cff,#7a4cff)}
.bottom{display:flex;justify-content:center;gap:36px;margin:32px 0}
.piece{display:grid;gap:4px;touch-action:none}
.piece div{width:26px;height:26px;border-radius:6px}
.dragging{position:fixed;z-index:999;pointer-events:none}
.popup{
 position:fixed;inset:0;background:#0009;
 display:flex;align-items:center;justify-content:center
}
.box{
 background:#2a3f7a;padding:26px;border-radius:20px;width:260px
}
.btn{
 background:#5fa7ff;padding:14px;margin:12px 0;
 border-radius:14px;font-weight:bold
}
.btn:active{transform:scale(.95)}
</style>
</head>

<body>

<div class="top">
 <div>👑 <span id="score">0</span></div>
 <div>LEVEL <span id="lvl">1</span></div>
</div>

<div class="board" id="board"></div>
<div class="bottom" id="pieces"></div>

<!-- Difficulty -->
<div class="popup" id="diff">
 <div class="box">
  <h2>Select Difficulty</h2>
  <div class="btn" onclick="start(1)">LOW</div>
  <div class="btn" onclick="start(2)">MEDIUM</div>
  <div class="btn" onclick="start(3)">HIGH</div>
 </div>
</div>

<!-- Game Over -->
<div class="popup" id="over" style="display:none">
 <div class="box">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore"></span></p>
  <p>Level: <span id="finalLevel"></span></p>
  <div class="btn" onclick="replay()">REPLAY</div>
 </div>
</div>

<audio id="place" src="https://assets.mixkit.co/sfx/preview/mixkit-click-1110.mp3"></audio>
<audio id="overS" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.wav"></audio>

<script>
const board=document.getElementById("board");
const pieces=document.getElementById("pieces");
const grid=[];
let score=0,level=1,diff=1;
let shape,color,drag;

const shapes=[
 {s:[[0,0],[1,0],[2,0]],c:"orange"},
 {s:[[0,0],[0,1],[0,2],[0,3]],c:"blue"},
 {s:[[0,0],[1,0],[0,1],[1,1]],c:"green"},
 {s:[[0,0],[1,0],[2,0],[1,1]],c:"purple"}
];

for(let i=0;i<100;i++){
 let d=document.createElement("div");
 d.className="cell";board.appendChild(d);grid.push(0);
}

function start(d){
 diff=d;
 document.getElementById("diff").style.display="none";
 spawn();
}

function spawn(){
 pieces.innerHTML="";
 let playable=false;
 for(let i=0;i<3;i++){
  let o=shapes[Math.floor(Math.random()*shapes.length)];
  let p=document.createElement("div");p.className="piece";
  o.s.forEach(()=>{let b=document.createElement("div");b.className=o.c;p.appendChild(b)});
  p.onpointerdown=e=>dragStart(e,o);
  pieces.appendChild(p);
  if(canAny(o.s)) playable=true;
 }
 if(!playable) gameOver();
}

function dragStart(e,o){
 drag=e.target.closest(".piece").cloneNode(true);
 drag.classList.add("dragging");document.body.appendChild(drag);
 shape=o.s;color=o.c;
 move(e);
 document.onpointermove=move;
 document.onpointerup=end;
}

function move(e){
 drag.style.left=e.clientX-30+"px";
 drag.style.top=e.clientY-30+"px";
}

function end(e){
 document.onpointermove=null;document.onpointerup=null;
 let cell=document.elementFromPoint(e.clientX,e.clientY);
 if(cell&&cell.classList.contains("cell")){
  let idx=[...board.children].indexOf(cell);
  if(can(idx)) place(idx);
 }
 drag.remove();
}

function can(idx){
 return shape.every(s=>{
  let x=idx%10+s[0],y=Math.floor(idx/10)+s[1];
  return x<10&&y<10&&grid[y*10+x]==0;
 });
}

function canAny(s){
 for(let i=0;i<100;i++){
  if(s.every(p=>{
   let x=i%10+p[0],y=Math.floor(i/10)+p[1];
   return x<10&&y<10&&grid[y*10+x]==0;
  })) return true;
 }
 return false;
}

function place(idx){
 shape.forEach(s=>{
  let i=(Math.floor(idx/10)+s[1])*10+(idx%10+s[0]);
  grid[i]=1;
  board.children[i].className="cell filled "+color;
 });
 score+=10*diff;
 document.getElementById("score").innerText=score;
 document.getElementById("place").play();
 if(score>level*300){level++;document.getElementById("lvl").innerText=level}
 spawn();
}

function gameOver(){
 document.getElementById("over").style.display="flex";
 document.getElementById("finalScore").innerText=score;
 document.getElementById("finalLevel").innerText=level;
 document.getElementById("overS").play();
 navigator.vibrate(200);
}

function replay(){
 location.reload();
}
</script>
</body>
</html>
