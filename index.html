<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shubham Block Game</title>

<style>
:root{
  --bg:#3f568f;
  --grid:#1e2a4f;
  --cell:#22335f;
  --glow:#6fe6ff;
}
*{box-sizing:border-box; touch-action:none;}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui, sans-serif;
  color:#fff;
  text-align:center;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  font-weight:700;
}

/* GRID */
.board-wrap{
  display:flex;
  justify-content:center;
}
.board{
  margin-top:10px;
  background:var(--grid);
  padding:10px;
  border-radius:18px;
  box-shadow:0 0 25px var(--glow);
}
.grid{
  display:grid;
  grid-template-columns:repeat(10,32px);
  grid-template-rows:repeat(10,32px);
  gap:4px;
}
.cell{
  width:32px;height:32px;
  background:var(--cell);
  border-radius:8px;
}
.cell.filled{
  box-shadow:inset -3px -3px 6px rgba(255,255,255,.2);
}
.ghost{
  opacity:.4;
  outline:2px dashed #fff;
}

/* SHAPES */
.shapes{
  display:flex;
  justify-content:space-around;
  margin:30px 10px;
}
.shape{
  display:grid;
  gap:4px;
}
.block{
  width:32px;height:32px;
  border-radius:8px;
  box-shadow:inset -3px -3px 6px rgba(255,255,255,.3);
}

/* COLORS */
.c1{background:#9b5cff;}
.c2{background:#ff9f43;}
.c3{background:#54a0ff;}
.c4{background:#2ecc71;}

/* GAME OVER */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.popup{
  background:#22335f;
  padding:25px;
  border-radius:16px;
}
.popup button{
  margin-top:15px;
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:10px;
}
</style>
</head>
<body>

<div class="header">
  <div>👑 <span id="score">0</span></div>
  <div>LEVEL 1</div>
</div>

<div class="board-wrap">
  <div class="board">
    <div id="grid" class="grid"></div>
  </div>
</div>

<div class="shapes" id="shapes"></div>

<div class="overlay" id="gameOver">
  <div class="popup">
    <h2>GAME OVER</h2>
    <p>Score: <span id="finalScore"></span></p>
    <button onclick="restart()">Replay</button>
  </div>
</div>

<script>
const gridEl = document.getElementById("grid");
const shapesEl = document.getElementById("shapes");
const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");

let grid = Array(100).fill(null);
let score = 0;
let dragShape = null;
let ghostCells = [];

const COLORS=["c1","c2","c3","c4"];
const SHAPES=[
 [[0,0],[1,0],[2,0]],          // line
 [[0,0],[0,1],[1,1]],          // L
 [[0,0],[1,0],[0,1],[1,1]],    // square
 [[0,0],[1,0],[2,0],[1,1]]     // T
];

function initGrid(){
  gridEl.innerHTML="";
  for(let i=0;i<100;i++){
    const c=document.createElement("div");
    c.className="cell";
    gridEl.appendChild(c);
  }
}

function createShape(){
  const shape = SHAPES[Math.floor(Math.random()*SHAPES.length)];
  const color = COLORS[Math.floor(Math.random()*COLORS.length)];
  return {shape,color};
}

function renderShapes(){
  shapesEl.innerHTML="";
  for(let i=0;i<3;i++){
    const data=createShape();
    const s=document.createElement("div");
    s.className="shape";
    s.dataset.shape=JSON.stringify(data.shape);
    s.dataset.color=data.color;

    const maxX=Math.max(...data.shape.map(p=>p[0]));
    const maxY=Math.max(...data.shape.map(p=>p[1]));
    s.style.gridTemplateColumns=`repeat(${maxX+1},32px)`;

    data.shape.forEach(p=>{
      const b=document.createElement("div");
      b.className="block "+data.color;
      b.style.gridColumn=p[0]+1;
      b.style.gridRow=p[1]+1;
      s.appendChild(b);
    });

    s.addEventListener("pointerdown",()=>dragShape=s);
    shapesEl.appendChild(s);
  }
}

function canPlace(shape,x,y){
  return shape.every(p=>{
    const nx=x+p[0], ny=y+p[1];
    return nx>=0&&ny>=0&&nx<10&&ny<10&&!grid[ny*10+nx];
  });
}

function clearGhost(){
  ghostCells.forEach(i=>gridEl.children[i].classList.remove("ghost"));
  ghostCells=[];
}

gridEl.addEventListener("pointermove",e=>{
  if(!dragShape) return;
  clearGhost();
  const rect=gridEl.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)/36);
  const y=Math.floor((e.clientY-rect.top)/36);
  const shape=JSON.parse(dragShape.dataset.shape);
  if(canPlace(shape,x,y)){
    shape.forEach(p=>{
      const idx=(y+p[1])*10+(x+p[0]);
      ghostCells.push(idx);
      gridEl.children[idx].classList.add("ghost");
    });
  }
});

gridEl.addEventListener("pointerup",e=>{
  if(!dragShape) return;
  const rect=gridEl.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)/36);
  const y=Math.floor((e.clientY-rect.top)/36);
  const shape=JSON.parse(dragShape.dataset.shape);
  const color=dragShape.dataset.color;

  if(canPlace(shape,x,y)){
    shape.forEach(p=>{
      const idx=(y+p[1])*10+(x+p[0]);
      grid[idx]=color;
      gridEl.children[idx].classList.add("filled",color);
    });
    dragShape.remove();
    score+=10;
    scoreEl.textContent=score;
    checkLines();
    if(shapesEl.children.length===0) renderShapes();
    if(checkGameOver()) showGameOver();
  }
  clearGhost();
  dragShape=null;
});

function checkLines(){
  for(let i=0;i<10;i++){
    if([...Array(10)].every((_,x)=>grid[i*10+x])){
      for(let x=0;x<10;x++) grid[i*10+x]=null;
    }
    if([...Array(10)].every((_,y)=>grid[y*10+i])){
      for(let y=0;y<10;y++) grid[y*10+i]=null;
    }
  }
  renderGrid();
}

function renderGrid(){
  grid.forEach((c,i)=>{
    const el=gridEl.children[i];
    el.className="cell";
    if(c) el.classList.add("filled",c);
  });
}

function checkGameOver(){
  const shapes=[...shapesEl.children];
  for(let s of shapes){
    const shape=JSON.parse(s.dataset.shape);
    for(let y=0;y<10;y++)
      for(let x=0;x<10;x++)
        if(canPlace(shape,x,y)) return false;
  }
  return true;
}

function showGameOver(){
  finalScoreEl.textContent=score;
  gameOverEl.style.display="flex";
}

function restart(){
  grid=Array(100).fill(null);
  score=0;
  scoreEl.textContent=0;
  gameOverEl.style.display="none";
  initGrid();
  renderShapes();
}

initGrid();
renderShapes();
</script>
</body>
</html>
