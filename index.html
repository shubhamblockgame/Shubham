<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>shubhams blovk</title>

<style>
  body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#3556a8;
    color:#fff;
    text-align:center;
    user-select:none;
  }

  /* ===== HEADER ===== */
  .top{
    padding:15px 10px 5px;
  }
  .title{
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform: lowercase;
  }
  .score{
    font-size:48px;
    font-weight:bold;
    margin-top:5px;
  }

  /* ===== BOARD ===== */
  #board{
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:4px;
    width:320px;
    background:#1e2a4f;
    padding:8px;
    border-radius:10px;
  }
  .cell{
    width:28px;
    height:28px;
    background:#111a33;
    border-radius:4px;
  }
  .filled{
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.15);
  }

  /* ===== SHAPES ===== */
  #shapes{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:15px 0 30px;
  }
  .shape{
    display:grid;
    gap:3px;
    cursor:grab;
  }
  .block{
    width:22px;
    height:22px;
    border-radius:4px;
  }

</style>
</head>
<body>

<div class="top">
  <div class="title">shubhams blovk</div>
  <div class="score" id="score">0</div>
</div>

<div id="board"></div>

<div id="shapes"></div>

<script>
/* ===== BASIC DATA ===== */
const boardSize = 10;
const board = document.getElementById("board");
const shapesDiv = document.getElementById("shapes");
const scoreText = document.getElementById("score");
let score = 0;

let grid = Array(boardSize*boardSize).fill(null);

/* ===== COLORS ===== */
const colors = ["#4da3ff","#f4c430","#a855f7","#22c55e","#fb923c"];

/* ===== SHAPE DEFINITIONS ===== */
const SHAPES = [
  [[1,1,1],[0,1,0]],       // T
  [[1,1],[1,1]],           // square
  [[1,1,1,1]],             // line
  [[1,0],[1,0],[1,1]],     // L
  [[0,1],[1,1],[1,0]]      // Z
];

/* ===== CREATE BOARD ===== */
for(let i=0;i<boardSize*boardSize;i++){
  const c = document.createElement("div");
  c.className="cell";
  c.dataset.index=i;
  board.appendChild(c);
}

/* ===== CREATE SHAPES ===== */
function createShapes(){
  shapesDiv.innerHTML="";
  for(let i=0;i<3;i++){
    const shape = SHAPES[Math.floor(Math.random()*SHAPES.length)];
    const color = colors[Math.floor(Math.random()*colors.length)];
    const el = document.createElement("div");
    el.className="shape";
    el.style.gridTemplateColumns=`repeat(${shape[0].length},1fr)`;
    el.shape = shape;
    el.color = color;

    shape.forEach(r=>{
      r.forEach(v=>{
        const b = document.createElement("div");
        b.className="block";
        b.style.background = v?color:"transparent";
        el.appendChild(b);
      });
    });

    el.onpointerdown = e => startDrag(e,el);
    shapesDiv.appendChild(el);
  }
}

/* ===== DRAG SYSTEM ===== */
let dragging=null, offsetX=0, offsetY=0;

function startDrag(e,shape){
  dragging = shape;
  offsetX = e.offsetX;
  offsetY = e.offsetY;
  shape.style.position="absolute";
  shape.style.zIndex=1000;
}

document.onpointermove = e =>{
  if(!dragging) return;
  dragging.style.left = (e.pageX-offsetX)+"px";
  dragging.style.top  = (e.pageY-offsetY)+"px";
};

document.onpointerup = e =>{
  if(!dragging) return;
  const rect = board.getBoundingClientRect();
  if(e.pageX>rect.left && e.pageX<rect.right &&
     e.pageY>rect.top && e.pageY<rect.bottom){
    const x = Math.floor((e.pageX-rect.left)/32);
    const y = Math.floor((e.pageY-rect.top)/32);
    if(placeShape(dragging.shape,dragging.color,x,y)){
      dragging.remove();
      if(shapesDiv.children.length===0) createShapes();
    }else{
      resetShape(dragging);
    }
  }else resetShape(dragging);
  dragging=null;
};

function resetShape(s){
  s.style.position="static";
}

/* ===== PLACE SHAPE ===== */
function placeShape(shape,color,x,y){
  let cells=[];
  for(let r=0;r<shape.length;r++){
    for(let c=0;c<shape[r].length;c++){
      if(shape[r][c]){
        let nx=x+c, ny=y+r;
        if(nx<0||ny<0||nx>=10||ny>=10) return false;
        let idx = ny*10+nx;
        if(grid[idx]) return false;
        cells.push(idx);
      }
    }
  }
  cells.forEach(i=>{
    grid[i]=color;
    board.children[i].style.background=color;
    board.children[i].classList.add("filled");
  });
  score += cells.length*10;
  scoreText.innerText = score;
  clearLines();
  return true;
}

/* ===== CLEAR ROWS & COLUMNS ===== */
function clearLines(){
  for(let r=0;r<10;r++){
    let row = [];
    for(let c=0;c<10;c++) row.push(r*10+c);
    if(row.every(i=>grid[i])){
      row.forEach(i=>clearCell(i));
      score+=100;
    }
  }
  for(let c=0;c<10;c++){
    let col=[];
    for(let r=0;r<10;r++) col.push(r*10+c);
    if(col.every(i=>grid[i])){
      col.forEach(i=>clearCell(i));
      score+=100;
    }
  }
  scoreText.innerText=score;
}

function clearCell(i){
  grid[i]=null;
  board.children[i].style.background="#111a33";
  board.children[i].classList.remove("filled");
}

/* ===== START ===== */
createShapes();
</script>

</body>
</html>
