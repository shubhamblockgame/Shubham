<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shubham’s Block</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    text-align: center;
  }

  h1 {
    margin-top: 15px;
    font-size: 28px;
  }

  #score {
    margin: 10px;
    font-size: 18px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    width: 320px;
    margin: 20px auto;
  }

  .cell {
    width: 35px;
    height: 35px;
    background: #334155;
    border-radius: 6px;
    cursor: pointer;
  }

  .cell.filled {
    background: #22c55e;
  }

  .controls {
    margin-bottom: 20px;
  }

  button {
    padding: 10px 16px;
    margin: 5px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #38bdf8;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>🧱 Shubham’s Block</h1>
<div id="score">Score: 0</div>

<div id="grid"></div>

<div class="controls">
  <button onclick="enableFill()">Fill Block</button>
  <button onclick="resetGame()">Reset</button>
</div>

<script>
  const grid = document.getElementById("grid");
  const scoreText = document.getElementById("score");
  let score = 0;
  let canFill = false;

  // Create 8x8 grid
  for (let i = 0; i < 64; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.addEventListener("click", () => fillCell(cell));
    grid.appendChild(cell);
  }

  function enableFill() {
    canFill = true;
  }

  function fillCell(cell) {
    if (!canFill) return;
    if (cell.classList.contains("filled")) return;

    cell.classList.add("filled");
    score += 10;
    scoreText.innerText = "Score: " + score;
    canFill = false;

    checkGameOver();
  }

  function checkGameOver() {
    const cells = document.querySelectorAll(".cell");
    let filledCount = 0;

    cells.forEach(cell => {
      if (cell.classList.contains("filled")) filledCount++;
    });

    if (filledCount === 64) {
      alert("Game Over!\nFinal Score: " + score);
    }
  }

  function resetGame() {
    document.querySelectorAll(".cell").forEach(cell => {
      cell.classList.remove("filled");
    });
    score = 0;
    scoreText.innerText = "Score: 0";
  }
</script>

</body>
</html>
