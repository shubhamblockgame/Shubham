<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shubham Block</title>
    <style>
        :root {
            --bg-color: #0b0e18;
            --grid-bg: #1a1f2e;
            --header-gold: linear-gradient(to bottom, #ffd700, #ffae00);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        /* Header Styling */
        #ui-layer {
            width: 100%;
            max-width: 400px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            background: var(--header-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .stats-bar {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(0, 191, 255, 0.3);
        }

        .stat-item { font-weight: bold; font-size: 18px; }
        .score-val { color: #ffd700; }

        /* Game Canvas */
        #game-container {
            position: relative;
            margin: 15px 0;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.2);
            border: 4px solid #1e3a5f;
            border-radius: 12px;
        }

        canvas {
            display: block;
            background-color: var(--grid-bg);
            border-radius: 8px;
        }

        /* Engaging Footer */
        .footer-text {
            margin-top: 15px;
            font-size: 18px;
            font-style: italic;
            color: #8a99ad;
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="title">SHUBHAM BLOCK</div>
        <div class="stats-bar">
            <div class="stat-item">👑 <span id="high-score">0</span></div>
            <div class="stat-item">SCORE: <span id="score" class="score-val">0</span></div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h1 style="color: #ff4444;">GAME OVER</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()" style="padding: 10px 25px; cursor: pointer; background: #ffd700; border: none; font-weight: bold; border-radius: 5px;">TRY AGAIN</button>
        </div>
    </div>

    <div class="footer-text" id="engaging-text">Relax & Play...</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highEl = document.getElementById('high-score');
        const footerEl = document.getElementById('engaging-text');

        // Configuration
        const ROWS = 8;
        const COLS = 8;
        const GRID_SIZE = 400;
        const CELL_SIZE = GRID_SIZE / ROWS;
        const PADDING = 10;
        
        canvas.width = GRID_SIZE;
        canvas.height = GRID_SIZE + 180; // Extra space for pieces

        let score = 0;
        let highscore = localStorage.getItem('shubham_high') || 0;
        highEl.textContent = highscore;

        let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let pieces = [];
        let draggingPiece = null;
        let dragOffset = { x: 0, y: 0 };
        let mousePos = { x: 0, y: 0 };

        const PIECE_TYPES = [
            [[1,1],[1,1]], // Square
            [[1,1,1,1]],   // Line
            [[1,1,1],[0,1,0]], // T
            [[1,1,0],[0,1,1]], // Z
            [[1,0],[1,0],[1,1]], // L
            [[1]] // Single
        ];

        const COLORS = ["#1E90FF", "#FF8C00", "#A020F0", "#32CD32", "#FF4500", "#00CED1", "#FFD700"];

        // Audio Engine (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function createPiece(index) {
            const shape = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            return {
                shape, color,
                x: 30 + (index * 130),
                y: GRID_SIZE + 40,
                origX: 30 + (index * 130),
                origY: GRID_SIZE + 40,
                width: shape[0].length * CELL_SIZE * 0.7,
                height: shape.length * CELL_SIZE * 0.7
            };
        }

        function spawnPieces() {
            pieces = [createPiece(0), createPiece(1), createPiece(2)];
            updateFooter();
        }

        function updateFooter() {
            const phrases = ["Legendary Move!", "Keep it up, Shubham!", "Relax & Play", "Beat the record!"];
            footerEl.textContent = phrases[Math.floor(Math.random() * phrases.length)];
        }

        // Draw functions
        function drawBlock(x, y, color, isGhost = false) {
            ctx.globalAlpha = isGhost ? 0.3 : 1;
            ctx.fillStyle = color;
            // Glossy effect
            ctx.beginPath();
            ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
            ctx.fill();
            
            if(!isGhost) {
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    ctx.fillStyle = "#111625";
                    ctx.beginPath();
                    ctx.roundRect(c*CELL_SIZE + 1, r*CELL_SIZE + 1, CELL_SIZE-2, CELL_SIZE-2, 5);
                    ctx.fill();
                    if(grid[r][c]) drawBlock(c*CELL_SIZE, r*CELL_SIZE, grid[r][c]);
                }
            }

            // Draw Ghost
            if(draggingPiece) {
                let gridX = Math.round((mousePos.x - dragOffset.x) / CELL_SIZE);
                let gridY = Math.round((mousePos.y - dragOffset.y) / CELL_SIZE);
                if(canPlace(draggingPiece.shape, gridX, gridY)) {
                    draggingPiece.shape.forEach((row, r) => {
                        row.forEach((cell, c) => {
                            if(cell) drawBlock((gridX + c)*CELL_SIZE, (gridY + r)*CELL_SIZE, draggingPiece.color, true);
                        });
                    });
                }
            }

            // Draw available pieces
            pieces.forEach(p => {
                if(p === draggingPiece) {
                    drawPiece(p, mousePos.x - dragOffset.x, mousePos.y - dragOffset.y, 1);
                } else {
                    drawPiece(p, p.x, p.y, 0.7);
                }
            });

            requestAnimationFrame(draw);
        }

        function drawPiece(p, x, y, scale) {
            p.shape.forEach((row, r) => {
                row.forEach((cell, c) => {
                    if(cell) {
                        const bSize = CELL_SIZE * scale;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.roundRect(x + c*bSize, y + r*bSize, bSize-2, bSize-2, 4);
                        ctx.fill();
                    }
                });
            });
        }

        function canPlace(shape, x, y) {
            for(let r=0; r<shape.length; r++) {
                for(let c=0; c<shape[r].length; c++) {
                    if(shape[r][c]) {
                        if(x+c < 0 || x+c >= COLS || y+r < 0 || y+r >= ROWS || grid[y+r][x+c]) return false;
                    }
                }
            }
            return true;
        }

        function placePiece(p, x, y) {
            p.shape.forEach((row, r) => {
                row.forEach((cell, c) => {
                    if(cell) grid[y+r][x+c] = p.color;
                });
            });
            score += 10;
            checkLines();
            pieces = pieces.filter(item => item !== p);
            if(pieces.length === 0) spawnPieces();
            scoreEl.textContent = score;
            playSound(440, 'sine');
            if(navigator.vibrate) navigator.vibrate(40);
        }

        function checkLines() {
            let toClearR = [], toClearC = [];
            for(let i=0; i<ROWS; i++) {
                if(grid[i].every(c => c !== 0)) toClearR.push(i);
                if(grid.map(row => row[i]).every(c => c !== 0)) toClearC.push(i);
            }
            
            toClearR.forEach(r => grid[r].fill(0));
            toClearC.forEach(c => grid.forEach(row => row[c] = 0));
            
            if(toClearR.length > 0 || toClearC.length > 0) {
                score += (toClearR.length + toClearC.length) * 100;
                playSound(880, 'square');
                if(navigator.vibrate) navigator.vibrate([60, 40, 60]);
            }
        }

        // Interaction
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('touchstart', handleDown);
        canvas.addEventListener('mousedown', handleDown);

        function handleDown(e) {
            const pos = getPos(e);
            pieces.forEach(p => {
                if(pos.x >= p.x && pos.x <= p.x + p.width && pos.y >= p.y && pos.y <= p.y + p.height) {
                    draggingPiece = p;
                    dragOffset = { x: pos.x - p.x, y: pos.y - p.y };
                }
            });
        }

        window.addEventListener('touchmove', handleMove);
        window.addEventListener('mousemove', handleMove);

        function handleMove(e) {
            if(!draggingPiece) return;
            mousePos = getPos(e);
        }

        window.addEventListener('touchend', handleUp);
        window.addEventListener('mouseup', handleUp);

        function handleUp() {
            if(!draggingPiece) return;
            let gridX = Math.round((mousePos.x - dragOffset.x) / CELL_SIZE);
            let gridY = Math.round((mousePos.y - dragOffset.y) / CELL_SIZE);
            
            if(canPlace(draggingPiece.shape, gridX, gridY)) {
                placePiece(draggingPiece, gridX, gridY);
            }
            draggingPiece = null;
        }

        function resetGame() {
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            scoreEl.textContent = 0;
            document.getElementById('game-over').style.display = 'none';
            spawnPieces();
        }

        spawnPieces();
        draw();
    </script>
</body>
</html>
