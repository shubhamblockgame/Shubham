<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shubham Block Official</title>
    <style>
        :root {
            --bg-blue: #4a69bd;
            --panel-dark: #1e272e;
            --accent-gold: #ffdd59;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-blue);
            font-family: 'Arial', sans-serif; display: flex;
            flex-direction: column; align-items: center; height: 100vh;
            overflow: hidden; touch-action: none; color: white;
        }

        /* Header UI matching your image */
        #ui-header {
            width: 100%; max-width: 400px; padding: 20px 0;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .branding { font-size: 32px; font-weight: 900; color: var(--accent-gold); margin: 0; }

        .stats { width: 85%; display: flex; justify-content: space-between; align-items: center; }

        .hi-score { font-size: 26px; font-weight: bold; color: var(--accent-gold); }

        .score-box {
            background: rgba(255, 255, 255, 0.2); padding: 5px 30px;
            border-radius: 10px; font-size: 26px; font-weight: bold;
        }

        /* The Game Grid */
        #game-container {
            background: #2f3542; padding: 6px; border-radius: 8px;
            border: 4px solid #3d4455; position: relative;
        }

        canvas { display: block; background-color: var(--panel-dark); border-radius: 4px; }

        /* Bottom Menu */
        #piece-dock {
            margin-top: 30px; display: flex; gap: 20px;
            justify-content: center; width: 100%; height: 120px;
        }

        .footer-text {
            margin-top: auto; margin-bottom: 40px; font-size: 48px;
            font-weight: 900; color: white; font-style: italic;
        }

        #game-over {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100;
        }

        button {
            background: var(--accent-gold); border: none; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-header">
        <h1 class="branding">SHUBHAM BLOCK</h1>
        <div class="stats">
            <div class="hi-score">👑 <span id="hi-val">8767</span></div>
            <div class="score-box" id="sc-val">0</div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h1 style="color:#ff5e57">GAME OVER</h1>
            <button onclick="location.reload()">RETRY</button>
        </div>
    </div>

    <div id="piece-dock"></div>

    <div class="footer-text">RELAXING!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID = 8, CELL = 42, SIZE = GRID * CELL;
        canvas.width = SIZE; canvas.height = SIZE;

        let score = 0;
        let grid = Array(GRID).fill().map(() => Array(GRID).fill(null));
        let pieces = [];
        let active = null;
        let mPos = { x: 0, y: 0 };

        const SHAPES = [
            { s: [[1,1],[1,1]], c: '#e74c3c' },
            { s: [[1,1,1]], c: '#f1c40f' },
            { s: [[1,1,1,1]], c: '#3498db' },
            { s: [[1,1],[0,1]], c: '#9b59b6' },
            { s: [[1,1],[1,0]], c: '#2ecc71' }
        ];

        function spawn() {
            const dock = document.getElementById('piece-dock');
            dock.innerHTML = '';
            pieces = [];
            for(let i=0; i<3; i++) {
                let r = SHAPES[Math.floor(Math.random()*SHAPES.length)];
                pieces.push({ shape: r.s, color: r.c, id: i });
                let div = document.createElement('div');
                div.style.width = '80px'; div.style.height = '80px';
                div.style.background = r.c; div.style.borderRadius = '8px';
                div.innerText = 'DRAG'; div.style.textAlign = 'center';
                div.style.lineHeight = '80px'; div.style.fontSize = '12px';
                div.onmousedown = div.ontouchstart = (e) => startDrag(e, pieces[i]);
                dock.appendChild(div);
            }
        }

        function drawBlock(x, y, color, alpha = 1) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 6);
            ctx.fill();
            // Bevel effect
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x + 6, y + 6, CELL - 12, 6);
            ctx.globalAlpha = 1;
        }

        function render() {
            ctx.clearRect(0,0,SIZE,SIZE);
            for(let r=0; r<GRID; r++) {
                for(let c=0; c<GRID; c++) {
                    ctx.fillStyle = '#262e3d';
                    ctx.fillRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2);
                    if(grid[r][c]) drawBlock(c*CELL, r*CELL, grid[r][c]);
                }
            }
            if(active) {
                let rect = canvas.getBoundingClientRect();
                let gx = Math.round((mPos.x - rect.left - CELL) / CELL);
                let gy = Math.round((mPos.y - rect.top - CELL) / CELL);
                active.shape.forEach((row, r) => row.forEach((v, c) => {
                    if(v && gy+r < GRID && gx+c < GRID) drawBlock((gx+c)*CELL, (gy+r)*CELL, active.color, 0.4);
                }));
            }
            requestAnimationFrame(render);
        }

        function startDrag(e, p) { 
            active = p; 
            window.onmousemove = window.ontouchmove = (ev) => {
                let t = ev.touches ? ev.touches[0] : ev;
                mPos = { x: t.clientX, y: t.clientY };
            };
            window.onmouseup = window.ontouchend = () => drop();
        }

        function drop() {
            if(!active) return;
            let rect = canvas.getBoundingClientRect();
            let gx = Math.round((mPos.x - rect.left - CELL) / CELL);
            let gy = Math.round((mPos.y - rect.top - CELL) / CELL);
            
            if(gx >= 0 && gy >= 0 && gx < GRID && gy < GRID) {
                active.shape.forEach((row, r) => row.forEach((v, c) => {
                    if(v) grid[gy+r][gx+c] = active.color;
                }));
                score += 10; document.getElementById('sc-val').innerText = score;
                check();
            }
            active = null;
        }

        function check() {
            for(let r=0; r<GRID; r++) if(grid[r].every(v => v)) grid[r].fill(null);
            for(let c=0; c<GRID; c++) if(grid.every(r => r[c])) grid.forEach(r => r[c] = null);
        }

        spawn(); render();
    </script>
</body>
</html>
