<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shubham Block - Official</title>
    <style>
        :root {
            --bg-blue: #4a69bd;
            --grid-dark: #1e272e;
            --accent-gold: #ffdd59;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-blue);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Top Header UI */
        #header {
            width: 100%;
            max-width: 400px;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .branding-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 0;
        }

        .stats-container {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .high-score {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-score-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 25px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }

        /* The Main Game Board */
        #game-board-container {
            background: #2f3542;
            padding: 8px;
            border-radius: 10px;
            border: 4px solid #3d4455;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        canvas {
            display: block;
            background-color: var(--grid-dark);
            border-radius: 4px;
        }

        /* Bottom Shape Menu */
        #shape-menu {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 120px;
        }

        .footer-text {
            margin-top: auto;
            margin-bottom: 30px;
            font-size: 42px;
            font-weight: 900;
            color: white;
            font-style: italic;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Game Over Overlay */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #overlay h1 { color: #ff5e57; font-size: 40px; margin-bottom: 10px; }
        #overlay button {
            background: var(--accent-gold);
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1 class="branding-title">SHUBHAM BLOCK</h1>
        <div class="stats-container">
            <div class="high-score">👑 <span id="hi-score-val">0</span></div>
            <div class="current-score-box" id="score-val">0</div>
        </div>
    </div>

    <div id="game-board-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="shape-menu">
        </div>

    <div class="footer-text">RELAXING!</div>

    <div id="overlay">
        <h1>GAME OVER</h1>
        <p style="color:white; font-size: 20px; margin-bottom: 20px;">Score: <span id="final-score">0</span></p>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-val');
        const hiDisplay = document.getElementById('hi-score-val');

        const GRID_SIZE = 8;
        const CELL = 42;
        const BOARD_WIDTH = GRID_SIZE * CELL;

        canvas.width = BOARD_WIDTH;
        canvas.height = BOARD_WIDTH;

        let score = 0;
        let highscore = localStorage.getItem('shubham_hi') || 8767;
        hiDisplay.innerText = highscore;

        let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
        let pieces = [];
        let activePiece = null;
        let mouseX = 0, mouseY = 0;

        const SHAPES = [
            { s: [[1,1],[1,1]], c: '#eb4d4b' }, // Red Square
            { s: [[1,1,1]], c: '#f1c40f' },    // Yellow Line
            { s: [[1,1],[0,1]], c: '#9b59b6' }, // Purple L
            { s: [[1,1,1,1]], c: '#3498db' },  // Blue Long
            { s: [[1,1],[1,1]], c: '#2ecc71' }  // Green Square
        ];

        function createPieces() {
            pieces = [];
            for(let i=0; i<3; i++) {
                let rand = SHAPES[Math.floor(Math.random()*SHAPES.length)];
                pieces.push({
                    shape: rand.s,
                    color: rand.c,
                    x: (window.innerWidth/2 - 150) + (i * 110),
                    y: window.innerHeight - 180,
                    origX: (window.innerWidth/2 - 150) + (i * 110),
                    origY: window.innerHeight - 180,
                    isDragging: false
                });
            }
        }

        function drawBlock(x, y, color, context = ctx, size = CELL, alpha = 1) {
            context.globalAlpha = alpha;
            context.fillStyle = color;
            context.beginPath();
            context.roundRect(x + 2, y + 2, size - 4, size - 4, 6);
            context.fill();
            
            // Glossy Bevel
            context.fillStyle = 'rgba(255,255,255,0.2)';
            context.fillRect(x + 5, y + 5, size - 10, size/4);
            context.globalAlpha = 1;
        }

        function render() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // Draw Grid
            for(let r=0; r<GRID_SIZE; r++) {
                for(let c=0; c<GRID_SIZE; c++) {
                    ctx.fillStyle = '#262e3d';
                    ctx.beginPath();
                    ctx.roundRect(c*CELL+1, r*CELL+1, CELL-2, CELL-2, 4);
                    ctx.fill();
                    if(grid[r][c]) drawBlock(c*CELL, r*CELL, grid[r][c]);
                }
            }

            // Ghost Preview
            if(activePiece) {
                const rect = canvas.getBoundingClientRect();
                let gx = Math.round((mouseX - rect.left - (activePiece.shape[0].length * CELL / 2)) / CELL);
                let gy = Math.round((mouseY - rect.top - (activePiece.shape.length * CELL / 2)) / CELL);
                
                if(canPlace(activePiece.shape, gx, gy)) {
                    activePiece.shape.forEach((row, r) => row.forEach((v, c) => {
                        if(v) drawBlock((gx+c)*CELL, (gy+r)*CELL, activePiece.color, ctx, CELL, 0.3);
                    }));
                }
            }

            requestAnimationFrame(render);
        }

        // Logic for piece placement
        function canPlace(shape, x, y) {
            return shape.every((row, r) => row.every((v, c) => {
                if(!v) return true;
                let nr = y + r, nc = x + c;
                return nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !grid[nr][nc];
            }));
        }

        // Interaction Handling
        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            pieces.forEach(p => {
                if(touch.clientX > p.x && touch.clientX < p.x + 100 && touch.clientY > p.y && touch.clientY < p.y + 100) {
                    activePiece = p;
                    p.isDragging = true;
                }
            });
        });

        window.addEventListener('touchmove', (e) => {
            if(!activePiece) return;
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => {
            if(!activePiece) return;
            const rect = canvas.getBoundingClientRect();
            let gx = Math.round((mouseX - rect.left - (activePiece.shape[0].length * CELL / 2)) / CELL);
            let gy = Math.round((mouseY - rect.top - (activePiece.shape.length * CELL / 2)) / CELL);

            if(canPlace(activePiece.shape, gx, gy)) {
                activePiece.shape.forEach((row, r) => row.forEach((v, c) => {
                    if(v) grid[gy+r][gx+c] = activePiece.color;
                }));
                score += 10;
                scoreDisplay.innerText = score;
                pieces = pieces.filter(p => p !== activePiece);
                if(pieces.length === 0) createPieces();
                if(navigator.vibrate) navigator.vibrate(50);
                checkLines();
            }
            activePiece = null;
        });

        function checkLines() {
            let cleared = 0;
            // Rows
            for(let r=0; r<GRID_SIZE; r++) {
                if(grid[r].every(v => v !== null)) {
                    grid[r] = Array(GRID_SIZE).fill(null);
                    cleared++;
                }
            }
            // Cols
            for(let c=0; c<GRID_SIZE; c++) {
                if(grid.every(r => r[c] !== null)) {
                    grid.forEach(r => r[c] = null);
                    cleared++;
                }
            }
            if(cleared > 0) score += cleared * 100;
        }

        createPieces();
        render();
    </script>
</body>
</html>
